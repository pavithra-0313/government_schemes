# Server Configuration
server.port=${PORT:8080}

# Application Name
spring.application.name=scholarship-finder

# Database Configuration (Defaults to MySQL-compatible in-memory store for instant run, easily overridden by MySQL 8 env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:scholarship_db;DB_CLOSE_DELAY=-1;MODE=MySQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Mail Configuration (JavaMail with env var placeholders)
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:scholarship.finder.alert@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:default_mail_app_password}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# OpenAPI / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Reminder Scheduler Configuration
app.scheduler.enabled=${SCHEDULER_ENABLED:true}
app.scheduler.cron=${SCHEDULER_CRON:0 0 9 * * *}

# Jackson Serialization / Deserialization
spring.jackson.deserialization.accept-empty-string-as-null-object=true
spring.jackson.deserialization.fail-on-unknown-properties=false
